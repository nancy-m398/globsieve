[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "globsieve"
version = "0.1.0"
description = "Filter lists of paths with glob-style include/exclude patterns"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "nancy-m398"}]

[project.scripts]
globsieve = "globsieve.cli:main"

[tool.setuptools.packages.find]
include = ["globsieve*"]
